# Template cues (plan sections 1.5, 1.6, 6.3). Everything layout-specific lives here, so a new
# company's layout is a new file, not a code change. Values were read off the sample TMP.

[page]
header_band_pt = 62          # text above this distance from the top edge is header band
footer_band_pt = 55          # text within this distance of the bottom edge is footer band
background_share = 0.8       # a filled rect covering more than this share of the page is background, not a cell

[intake]
min_text_chars = 20          # fewer characters than this on a page = no usable text layer
scanned_share = 0.5          # scanned = more than this share of pages has no text layer

[text]
word_gap_em = 0.25           # gap wider than this x font size starts a new word
segment_gap_em = 2.5         # gap wider than this x font size splits a line into segments
segment_gap_min_pt = 15
line_join_em = 0.6           # vertical gap (x font size) up to which segments form one block
line_base_em = 1.2           # fixed part of the allowed line-to-line gap (x font size); line_join_em is added
line_group_em = 0.6          # glyphs whose baselines differ by less than this x font size share a line
block_break_em = 2.5         # a vertical jump larger than this x font size ends a block
column_overlap = 0.5         # share of the narrower segment two lines must overlap to be one column
left_align_tol_pt = 4
row_tol_pt = 3               # blocks whose tops are within this are read left to right
heading_min_delta = 2         # a bold line this many pt above body size is a level 1 heading; a bold line within it is level 2
strike_band_low = 0.25       # a strikethrough rule sits between these fractions of the line height...
strike_band_high = 0.75
strike_min_cover = 0.6       # ...and covers at least this share of the line's width
strike_max_overhang_pt = 4   # a longer rule than the text by more than this is a border, not a strikethrough

[quality]
low_threshold = 0.6          # share of dictionary words below which a text block is flagged
min_words = 4                # blocks with fewer words are too short to judge (names, codes), unless unmapped glyphs show

[tables]
thin_pt = 2.0                # a rect thinner than this is a ruling line
min_rule_len_pt = 6
min_fill_pt = 5
join_tol_pt = 1.0
edge_tol_pt = 1.5
min_parts = 4
min_cells = 2
header_fills = [[0.835, 0.961, 1.0], [0.0, 0.31, 0.41]]   # fill colours that mark a header row (a template cue)
header_fill_tol = 0.03
rule_cover = 0.8             # a ruling segment closes a cell edge when it covers this share of the edge
stitch_x_tol_pt = 6          # column positions of a continued table match within this

[ticks]
ticked = ["☒", "☑", "✓", "✔", "✗", "✘"]
unticked = ["☐"]
square_min_pt = 6
square_max_pt = 16
contain_pad_pt = 0.5         # slack when testing that a mark lies inside a box
square_aspect_tol_pt = 1.2   # a vector square's width and height may differ by this much

[checkboxes]
row_tol_pt = 2               # vertical slack when deciding that a label shares a row with a box
label_gap_pt = 40            # the label of a label-then-box pair ends no further than this left of the box
note_gap_pt = 18             # free text counts as the box's note when it starts within this right of the box
yes_labels = ["yes"]
no_labels = ["no"]

[risk]
colour_tol = 0.35            # a cell colour is a key colour when its RGB distance is at most this
column_tol_pt = 40           # a score cell belongs to the impact column whose label is this close (x centre)
row_tol_pt = 8               # ...and to the likelihood row whose label centre is this close (y)
description_match = 0.6      # minimum text similarity to treat a register consequence as a key description

[furniture]
min_page_share = 0.5         # repeated on more than this share of pages = page furniture
min_line_share = 0.5         # a block is furniture when at least this share of its lines repeats
form_name_regex = '(\d)\.\s*TMP\s+(.+?)\s+Form'
tmp_ref_regex = '[A-Z]{2,5}\s?\d{2}-\d{4}'
page_number_regex = 'Page\s+(\d+)'

[zones]
header_band_regex = 'TMP\s*Reference'
sheet_no_regex = 'SHEET\s*NO'
generic_code_regex = 'FH\.M\d+'
diagram_image_cover = 0.5
diagram_min_paths = 15
rating_tol = 0.06
rating_min_cells = 5
risk_page_table_share = 0.5  # risk regions holding this share of a page's body table area make risk the page default
rating_colours = [[1.0, 0.0, 0.0], [0.96, 0.52, 0.17], [1.0, 1.0, 0.0], [1.0, 0.95, 0.0], [0.0, 0.69, 0.31], [0.62, 0.98, 0.53]]

[zones.form_kind]            # footer form name (lower case, between "TMP" and "Form") -> zone
"planning" = "forms"
"job pack" = "narrative"
"regulatory authorisation" = "forms"

[figures]
decorative_max_area = 0.03   # smaller than this share of the page and no text inside = decorative
informative_min_area = 0.05  # larger than this share = informative; in between = unclear (needs_x1)
repeat_iou = 0.9             # same spot on most pages (IoU above this) = decorative
repeat_min_pages = 3         # a figure cannot "repeat" in a document shorter than this
repeat_page_share = 0.5      # a figure repeats when it sits in the same spot on more than this share of pages

[diagrams]
enabled = true
touch_overlap = 0.5          # two drawn objects belong to one symbol when this share of the smaller lies inside the other
area_min_pt2 = 4000.0        # a filled shape larger than this (pt squared) is an area, never part of a sign
cone_run_gap_pt = 16.0       # consecutive cones closer than this form one run
fragment_max_pt2 = 300.0     # drawn pieces smaller than this (pt squared) that touch merge into one icon
fragment_gap_pt = 3.0        # ...when no further apart than this
line_turn_deg = 20.0         # a glyph continues a text line when its direction is within this of the line's
line_max_gap_em = 2.5        # ...and its origin is no further than this x font size from the last glyph
tile_cols = 2               # no-vector fallback: the plan is read in this many tile columns...
tile_rows = 2               # ...and rows
tile_overlap_pt = 20.0       # tiles overlap by this much so nothing is cut in half
near_dup_bits = 6            # pictures whose 64-bit hashes differ by at most this many bits are the same picture
rp_assoc_max_pt = 45.0       # an RP label belongs to the nearest sign if that sign is within this
plate_assoc_max_pt = 40.0    # a TEMPORARY plate claims the nearest speed disc within this
title_block_max_share = 0.25   # the title block frame covers less than this share of the page
notes_bullet = '^[\u25ba\u25b6\u2022\-*]'
legend_title = '(?i)^\s*LEGEND\s*$'
notes_title = '(?i)^\s*NOTES\s*:?\s*$'
callout_min_words = 6        # a framed text with at least this many words is an instruction callout

[diagrams.describe]          # image facts for image questions (diagrams/describe.py, X13)
end_tol_pt = 10.0            # a dimension line ends at an item when its edge (areas) or centre (signs) is this close
end_max_d_pt = 130.0         # ...and the item is no further than this from the line, across it
garbled = '[^\x20-\x7E\u00A0-\u00FF\u2013\u2014\u2018\u2019\u201C\u201D\u2022\u25BA\u25B6\u00B0\u2026]'
garbled_match_min = 0.7      # a reading of garbled text keeps at least this share of its plain letters, in order
skip_place = '(?i)www\.|\.com\b|\.co\.nz\b|\.nz\b|@'
read_tiles = true            # X13 also reads the plan in tiles for small detail

[diagrams.patterns]          # label shapes, matched on upper-case text without spaces
rp_label = '^RP(\d+\.\d+)$'
dimension_label = '^(\d+(?:\.\d+)?)M$'
road_label = '^(.+?)-(L\d+|LV)$'
house_label = '^#\d+[A-Z]?$'
speed_value = '^\d{2,3}$'
controller = '^STOPGO$'

[diagrams.sign_text]         # sign kind -> text cue, first match wins
speed_ahead_sign = 'KM/H.*AHEAD|AHEAD.*KM/H'
school_zone = 'SCHOOLZONE'
advance_sign = 'BUSSTOP.*AHEAD|AHEAD.*BUSSTOP|\d+M.*AHEAD'
end_of_works_sign = 'WORKS?END'
supplementary_plate = '^TEMPORARY$'
bus_stop_sign = 'BUSSTOP'
warning_sign = 'ONSIDEROAD|PLEASESTOP|ROADWORKS|CAUTION'

[diagrams.title_labels]      # title block field -> its printed label, matched on upper-case text without spaces
sheet = '^SHEETNO:?$'
rev = '^REVNO:?$'
date = '^DATE:?$'
scale = '^SCALE:?$'
tmp_number = '^TMPNUMBER:?$'
drawn_by = '^DRAWN&?CHECKEDBY:?$'
project = '^PROJECTDESCRIPTION:?$'
prepared_for = '^PREPAREDFOR'
originator = '^DRAWINGORIGINATOR:?$'

[diagrams.area_meanings]     # legend meaning (lower case) -> area kind
"work area" = "work_area"
"safety zone" = "safety_zone"

[facts]                      # Phase 4: field mapper, pointers, diagram ids, sign-offs and checks (plan part 3)
tmd_mention = '(?i)\bTMD\s*(?:[-–]\s*)?(?:Sheet\s*|No\.?\s*)?0*(\d{1,2})\b'
title_stop = '(?i)\bTMD\b|[,;.()\[\]\n]|\s(?:and|as per|with|for)\s'
title_max_words = 4
title_stopwords = ["the", "a", "an", "of", "and", "for", "to", "plan", "sheet", "tmd", "management", "traffic"]
stage_list_context = '(?i)ttm stages|work staging|staging'
heading_max_gap_pt = 90.0
tsl_row = '(?i)tsl|temporary speed limit'
tsl_requested = '(?i)temporary speed limit'
order_reference_label = '(?i)order\s*/\s*reference|tmp order'
contact_labels = '(?i)^(client|contractor|subcontractor|stms|site contact)\b'
checked_by_role = "design_checker"
incompatible_modes = ["two_way:stop_go"]
start_date_fields = ["work_period.start_date", "speed_limit.date_from"]
end_date_fields = ["work_period.end_date", "speed_limit.date_to"]

[facts.name_abbreviations]   # applied word by word before road and place names are compared
ave = "avenue"
rd = "road"
st = "street"
dr = "drive"
pl = "place"
cres = "crescent"
hwy = "highway"
ln = "lane"
tce = "terrace"

[facts.day_types]            # canonical day type -> how it is written (case-insensitive)
school_days = '(?i)school\s*days'
school_holidays = '(?i)school\s*holidays'
weekends = '(?i)week\s*ends?'

[facts.pointer_targets]      # a "See Above" in the first field resolves to the second, nearest earlier in the same form
"work_period.start_time" = "shift_window.first_sign_in"
"work_period.finish_time" = "shift_window.site_cleared"

[facts.signoff_roles]        # role -> cue in the heading above the block or its first row; first match wins
rca_authorisation_form3 = '(?i)authorise this request'
rca_other = '(?i)other network'
rca_primary = '(?i)primary network'
activity_manager = '(?i)activity manager'
ttm_designer = '(?i)ttm designer|designed by'

[facts.signoff_labels]       # field -> printed label in a sign-off grid (the value is in the cell below)
name = '(?i)^name:?$'
email = '(?i)^e-?mail:?$'
phone = '(?i)^phone:?$'
organisation = '(?i)^organisation(\s+and\s+role)?:?$'
signature = '(?i)^signature:?$'
date = '(?i)^date:?$'
checked_by = '(?i)^checked\s+by:?$'

[facts.flow_statements]      # traffic mode -> sentence in the text that claims it (rule 4)
two_way = '(?i)two[-\s]way traffic (?:will be|is) maintained'

[facts.diagram_modes]        # traffic mode -> diagram sheet title that shows it (rule 4)
stop_go = '(?i)\bstop\s*[/-]?\s*go\b'

[chunks]                     # Phase 5: chunk types, sizes, text and metadata (plan part 4)
target_min = 200
target_max = 450
hard_max = 600
merge_below = 60
split_overlap_sentences = 2
other_overlap = 0.12
sign_schedule_max = 15
breadcrumb_sep = " › "
doc_context = "Temporary traffic management for {activity}, {site}"
site_pattern = '(?i)worksite location:\s*([^|\n]+?)\s*$'
activity_context = '(?i)work activity description'
procedure_table = '\bON-SITE\b|TTM Installation|TTM Removal|\bPOST REMOVAL\b|\bLANE DIVERSION -'
procedure_removal = '(?i)^\s*TTM Removal\b|\bPOST REMOVAL\b'
boilerplate_min_pages = 3
default_access_groups = []

[chunks.glossary]            # added to the embedding text when the abbreviation appears in a chunk
STMS = "site traffic management supervisor"
TSL = "temporary speed limit"
TMO = "traffic management operative"
TTM = "temporary traffic management"
TMP = "traffic management plan"
TMD = "traffic management diagram"
MTC = "mobile traffic control"
CSD = "clear sight distance"
RCA = "road controlling authority"
PCBU = "person conducting a business or undertaking"
AADT = "annual average daily traffic"
HMV = "heavy motor vehicles"
ONRC = "One Network Road Classification"
RP = "route position"
LSZ = "longitudinal safety zone"
WHS = "workplace health and safety"

[chunks.parties]             # metadata party -> contact or sign-off role that names it (organisation preferred)
client = '(?i)^client'
contractor = '(?i)^contractor|^activity_manager$'
rca = '(?i)^rca_primary$'
designer = '(?i)^ttm_designer$'

[chunks.procedure_operations]   # operation -> its heading inside a procedure cell (upper case, matched anywhere)
on_site = '\bON-SITE\b'
lane_diversion = '\bLANE DIVERSION\b'
stop_go = '\bSTOP\s*/\s*GO(?: OPERATION)?\b'
shoulder_closure = '\bSHOULDER CLOSURE\b'
parking_management = '\bPARKING MANAGEMENT\b|\bNO PARKER\b'
unattended = '\bUNATTENDED\b'
post_installation = '\bPOST INSTALLATION(?: PROCEDURE)?\b'
post_removal = '\bPOST REMOVAL(?: PROCEDURE)?\b'

[retrieval]                  # Phase 6: resolve, classify, recipes, tools, context and answer (plan part 5)
tmp_ref = '(?i)\b([A-Z]{2,5})\s*(\d{2})\s*[-–]\s*(\d{3,5})\b'     # groups: company prefix, year, number
time_mention = '(?i)\b\d{1,2}(?:[:.]\d{2})?\s*(?:am|pm)\b|\b[0-2]\d[:.]?[0-5]\d\s*(?:hrs?|hours)?\b|\b(?:mon|tues|wednes|thurs|fri|satur|sun)day\b|\btoday\b|\btonight\b|\btomorrow\b|\bschool\s*(?:days?|holidays?)\b|\bweek\s*ends?\b|\bpublic\s*holiday'
follow_up = '(?i)^\s*(?:and|also|what about|how about|same)\b|\b(?:it|that one|this one|the other(?: one)?|those|them)\b'
road_suffix = '(?i)\b(avenue|road|street|drive|place|crescent|highway|lane|terrace|ave|rd|st|dr|pl|cres|hwy|ln|tce)\b'
candidates = 20              # keyword and vector candidates per search, before fusion
rrf_k = 60
detail_boost = 0.5           # added (in rank units) to chunks matching a TMD, road or RP named in the question
min_score_ratio = 0.4        # keyword candidates scoring below this share of the best one are dropped (0 = keep all)
max_linked_sheets = 1        # diagram overviews (about 450 tokens each) one search may add for the sheets its hits name
sheet_whole = '(?i)\bdescribe\b|\bsummar|\boverview\b|\blist (?:all|every)\b|\ball (?:the |visible |readable )?(?:text|labels?|distances?|signs?|measurements?|annotations?|references?|information)\b|\bevery\b|\bextract\b|\btranscribe\b|\bjson\b|\bstructured\b|\bunreadable\b|\bcannot be\b|\bmissing\b|\bassumptions?\b|\binferences?\b|\bsupported\b|\bverify\b|\breview\b|\bsafety risks?\b|\bcompliance\b|\bpurpose\b|\bwhat (?:type|kind) of\b|\bmajor elements\b'   # named-sheet questions that get the whole sheet; others search within it
context_budget = 10000        # tokens; chunks are cut from the bottom first, never facts or conflicts
calendar = "nz_calendar.toml"
timezone = "Pacific/Auckland"
default_role = "designer"

[retrieval.rules]            # question type -> cue; checked in this order (plan 5.4); "fact" only when nothing else matches
status = '(?i)\bapprov|\bsigned\b|\bsign[-\s]?off|\bsignatur|\b(?:need|needs|have|has) to sign\b|\bwho (?:must|should) sign\b|\bauthoris|\bconflict|\bcontradict|\bdiscrepanc|\berrors?\b'
calculation = '(?i)\bhow long\b|\bhow far\b|\bdistance between\b|\bdifference\b|\btotal\b|\blength of\b'
time_check = '(?i)\bcan (?:we|i|the crew|they)\b|\ballowed\b|\bin force\b|\bwork at\b|\bstill be on site\b|\bpermitted\b|\bok to work\b'
diagram = '(?i)\bTMD\b|\bTMD\s*-?\d|\bdiagram|\bsheet\b|\blayout\b|\bsigns\b|\bsign (?:order|schedule|spacing|position)|\bcones?\b|\btaper\b|\bcontroller|\bimage\b|\bpicture|\bdrawing\b|\bdrawn\b|\bplan view\b|\bvisible\b|\bshown\b|\bshows?\b|\btranscribe|\blabels?\b|\bannotation|\bnotice\b|\bdistances?\b(?!\s+between\s+(?:the\s+)?RPs?\b)|\bmeasurements?\b|\bdimensions?\b|\bhow far\b|\bspacing\b|\bleft to right\b|\bright to left\b|\bposition|\blocated\b|\bwhich side\b|\blooks? like\b|\bappear|\bcolou?r|\blegend\b|\btitle block\b|\bdrawn by\b|\bscale\b|\bunreadable\b|\bunclear\b|\bsymbols?\b|\bpictogram|\binset\b|\barrow'
across_tmps = '(?i)\bwhich tmps\b|\ball tmps\b|\bany tmps?\b|\bacross\b|\bother tmps\b'
procedure = '(?i)\bwho (?:do|should|must) we (?:call|contact|notify|tell)\b|\bif (?:the )?work runs late\b|\bwhat if\b|\bwhat do we do\b|\bprocedure|\bhow do we\b|\bin case of\b|\bwhat happens if\b|\bwhat must be done\b'
summary = '(?i)\bsummary\b|\bsummari[sz]e|\btoolbox\b|\boverview\b'
version_change = '(?i)\bwhat changed\b|\bdifference between versions\b|\bV[2-9]\b|\bprevious version\b'
general_rule = '(?i)\bin general\b|\bgeneral(?:ly)? rule\b|\bstandard says\b|\bgeneric\b'
out_of_scope = '(?i)\b(?:is|are) (?:a |an |the )?.{0,30}\b(?:enough|sufficient|compliant|ok)\b.{0,20}\bfor (?:a )?\d+\s*(?:km/?h)?\s*road\b|\bcopttm says\b|\bweather\b'
fact = '(?i)\bspeed\b|\baadt\b|\bstart date\b|\bend date\b|\bwho is\b|\bwho are\b|\bphone\b|\bcontact\b|\bclient\b|\bcontractor\b|\brp\b|\bonrc\b|\bhmv\b|\bwhen\b|\bwhat time\b|\bhours\b|\brisk\b|\brating\b|\bticked\b|\bbus\b|\bpedestrian|\bcyclist|\bstages?\b|\bdates?\b|\bwidth\b|\blanes?\b|\baddress\b|\bwhere\b|\bwhat is\b|\bwhat.?s\b|\bis it\b|\bis there\b|\bdoes\b|\bwhich\b'

[retrieval.day_types]        # day type in a question -> how it is asked
school_day = '(?i)\bschool\s*(?:days?|term)\b'
school_holiday = '(?i)\bschool\s*holidays?\b|\bholidays?\b(?!\s*public)'
weekend = '(?i)\bweek\s*ends?\b|\bsaturdays?\b|\bsundays?\b'
public_holiday = '(?i)\bpublic\s*holidays?\b'

[retrieval.day_type_facts]   # day type in a question -> the canonical day type in the facts (facts.day_types)
school_day = "school_days"
school_holiday = "school_holidays"
weekend = "weekends"

[retrieval.entities]         # get_facts entity (plan 5.6) -> the entity the facts store holds; "*" entries are built in code
road = "road"
shift_window = "shift_window"
speed_limit = "speed_limit"
stage = "stage"
checkbox = "form_answer|road_aspect|vulnerable_user|road_geometry"
risk = "risk"
risk_matrix = "risk_matrix_cell"
contact = "contact"
authorisation = "authorisation"
vulnerable_user = "vulnerable_user"
road_geometry = "road_geometry|road_aspect"
section_facts = "section"
figure = "figure"
work_period = "work_period"
doc_card = "*"
tmd_sheet = "*"

[retrieval.entity_cues]      # words in a question -> the get_facts entity it asks about (all matches are fetched)
road = '(?i)\bspeed\b(?!\s*limit)|\baadt\b|\bonrc\b|\bhmv\b|\bheavy\b|\broad\b|\bRP\b|\bposted\b|\bpeak\b'
shift_window = '(?i)\bhours\b|\bwhen\b|\bwhat time\b|\bsign[-\s]?in\b|\bsite cleared\b|\bcleared\b|\bpick[-\s]?up\b|\bshift\b|\bwork at\b|\bweekends?\b|\bschool\b'
speed_limit = '(?i)\bspeed limit\b|\btsl\b|\b\d{2}\s*(?:km/?h)?\s*zone\b|\btemporary speed\b|\b30\b'
stage = '(?i)\bstages?\b|\bstaging\b|\bTMD\b|\bdiagram\b'
checkbox = '(?i)\bticked\b|\bbus\b|\bpedestrian|\bcyclist|\bschool\b(?!\s*(?:days?|holidays?|terms?)\b)|\baged\b|\brail\b|\bparking\b|\bintersection|\bsignals?\b|\bdetour\b|\bpublic transport\b'
risk = '(?i)\brisks?\b|\bhazard|\bresidual\b|\binitial risk\b|\bcontrols?\b'
risk_matrix = '(?i)\bmatrix\b|\blikely\b|\blikelihood\b|\bconsequence\b|\brating\b|\bscore\b'
contact = '(?i)\bwho\b|\bphone\b|\bcall\b|\bcontact\b|\bclient\b|\bcontractor\b|\bdesigner\b|\bemail\b|\bnumber for\b'
authorisation = '(?i)\bauthoris|\bregulatory\b'
road_geometry = '(?i)\bwidth\b|\blanes?\b|\bshoulder\b|\bgeometry\b'
work_period = '(?i)\bdates?\b|\bstart\b|\bend\b|\bfinish\b|\bhow long will\b|\bduration\b|\bweeks?\b'
figure = '(?i)\bmeter\b|\bsite plan\b|\bphoto|\bimage\b|\bfigure\b|\bmap\b'

[retrieval.sheet_topics]     # a named sheet: chunk type -> question words that bring all of that sheet's chunks of the type
sheet_distances = '(?i)\bdistances?\b|\bmeasure|\bdimension|\bhow far\b|\blength|\bmetres?\b|\b\d+\s*m\b|\bspacing\b|\bbetween\b'
sheet_text = '(?i)\btext\b|\blabels?\b|\bwritten\b|\bwording\b|\bsays?\b|\bnotice\b|\bannotation|\bread\b|\bprinted\b|\btitle\b'
sheet_layout = '(?i)\bwhere\b|\bposition|\blocat|\bleft\b|\bright\b|\bside\b|\border\b|\binset\b|\bnext to\b|\bbefore\b|\bafter\b|\brelative\b|\barrangement\b|\bhouse|\bplace'
sheet_image = '(?i)\blooks?\b|\bappear|\bcolou?r|\bshape\b|\bpedestrian|\bvehicles?\b|\bwhy\b|\bchange\b|\bpurpose\b|\bunclear\b|\binferr?'
sheet_sign_schedule = '(?i)\bsigns?\b|\bapproach|\bdriver'
sheet_notes = '(?i)\bnotes?\b|\bcones?\b|\btaper\b|\bsafety zone\b'
sheet_details = '(?i)\btitle block\b|\bdrawn\b|\bscale\b|\bdate\b|\brev(?:ision)?\b|\blegend\b|\bdesigner\b|\bcompany\b'
figure_caption = '(?i)\bpictures?\b|\bphoto|\bfigure|\billustration|\boption'

[retrieval.chunk_types]      # recipe -> chunk types searched (empty = all)
fact = []
procedure = ["narrative_section", "narrative_table_row", "procedure"]
diagram = ["sheet_overview", "sheet_sign_schedule", "sheet_notes", "sheet_text", "sheet_layout", "sheet_distances",
           "sheet_details", "sheet_image", "figure_caption"]
summary = []
general_rule = ["standard_rule"]
baseline = []

[retrieval.k]                # recipe -> chunks kept after fusion and ranking
fact = 4
procedure = 8
diagram = 12
diagram_sheet = 3            # a named sheet: best chunks of that sheet beyond its topic chunks (plus overview, split parts)
summary = 10
general_rule = 5
baseline = 8
default = 6

[retrieval.calculations]     # calculation -> when the question asks for it, the stored values it combines and the result unit
# names in `expression` are fields of one `entity` fact; `stated` is a field the document states for the same result
# (the answer shows the cross-check); `match` picks the fact whose `match_field` the question names (for example a road)
tsl_length = { when = '(?i)\b(?:how long|length|how far|distance)\b.*\b(?:zone|tsl|speed limit|\d{2}\s*(?:km/?h)?)\b|\b(?:zone|tsl|speed limit)\b.*\b(?:how long|length)\b', entity = "speed_limit", expression = "rp_to - rp_from", result_unit = "m", stated = "length_m" }
site_extent = { when = '(?i)\b(?:how long|length|how far|distance)\b.*\b(?:road|site|work area|extent|street|avenue|lane)\b', entity = "road", expression = "end_rp - start_rp", result_unit = "m", stated = "", match_field = "road_name" }
works_duration = { when = '(?i)\bhow (?:many days|long)\b.*\b(?:works?|job|programme|tmp)\b(?!.*\bzone\b)|\bduration\b', entity = "work_period", expression = "end_date - start_date", result_unit = "days", stated = "" }

[retrieval.role_styles]      # Q3 style per user role (plan 5.11)
site = "Short: the answer in one or two lines, then the source."
designer = "Full: answer, working, sources, conflicts, statuses, sign-off detail."
office = "Plain language; contacts and dates first."

[retrieval.responses]        # fixed responses (plan 5.13); {placeholders} are filled in code
ask_back = "I found {n} TMPs: {options}. Which one?"
no_match = "I couldn't find a TMP for that address or number. Can you give the TMP number (for example {example})?"
not_in_tmp = "The TMP doesn't say {what}."
out_of_scope = "That needs the official standard's tables, which aren't loaded. The TMP itself says: {what}"
no_access = "That TMP isn't available to you."
no_tmp = "Which TMP is this about? Give the TMP number (for example {example}) or the site address."
