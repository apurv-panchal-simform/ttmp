[project]
name = "tmp-pipeline"
version = "0.1.0"
description = "TMP extraction, chunking and retrieval pipeline"
authors = [
    { name = "apurvpanchal-simform", email = "apurv.panchal@simformsolutions.com" }
]
requires-python = ">=3.13"
dependencies = [
    "numpy>=2.5.3",
    "opencv-python-headless>=5.0.0.93",
    "pdfplumber>=0.11.10",
    "pillow>=13.0.0",
    "pypdf>=6.19.0",
    "pypdfium2>=5.14.0",
    "pyyaml>=6.0.3",
    "tiktoken>=0.8",
]

[project.optional-dependencies]
azure = ["azure-identity>=1.19"]
postgres = ["psycopg[binary]>=3.2"]
search = []                       # live embeddings and Azure AI Search use only the standard library
tracing = [
    "opentelemetry-exporter-otlp-proto-http>=1.30",
    "opentelemetry-sdk>=1.30",
]
cosmos = [
    "azure-cosmos>=4.9",
]
ui = [
    "pandas>=2.2",
    "streamlit>=1.40",
]

[project.scripts]
tmp-pipeline = "tmp_pipeline.ingestion.run:main"
tmp-pipeline-di = "tmp_pipeline.ingestion.extract.di.run:main"
tmp-pipeline-gold = "tmp_pipeline.ingestion.score:main"
tmp-pipeline-facts = "tmp_pipeline.ingestion.facts.cli:main_facts"
tmp-pipeline-review = "tmp_pipeline.ingestion.facts.cli:main_review"
tmp-pipeline-db = "tmp_pipeline.ingestion.embedding.db.run:main"
tmp-pipeline-chunks = "tmp_pipeline.ingestion.chunking.cli:main"
tmp-pipeline-index = "tmp_pipeline.ingestion.embedding.search.run:main"
tmp-pipeline-ask = "tmp_pipeline.retrieval.cli:main"
tmp-pipeline-qa = "tmp_pipeline.retrieval.eval:main"
tmp-pipeline-cosmos = "tmp_pipeline.ingestion.embedding.cosmos.cli:main"
tmp-pipeline-ui = "tmp_pipeline.retrieval.ui.launch:main"
tmp-pipeline-synthetic = "tmp_pipeline.retrieval.synthetic:main"

[build-system]
requires = ["uv_build>=0.10.4,<0.11.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "reportlab>=5.0.1",
    "ruff>=0.9",
    "mypy>=1.14",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests", "tests/ingestion", "tests/retrieval"]       # tests share helpers and fixtures across the folders
markers = [
    "sample: needs tests/data/sample.pdf (fails instead of skipping when TMP_REQUIRE_SAMPLE=1)",
    "live: calls a live Azure service; skipped without credentials",
    "postgres: writes to a PostgreSQL database; skipped without TMP_PG_DSN",
]

[tool.ruff]
line-length = 120
target-version = "py313"
src = ["src", "tests", "tests/ingestion", "tests/retrieval"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
# style-only rules: long lines and single-letter names are tolerated; the rest stay enforced
ignore = ["E501", "E741", "B905", "SIM102", "SIM110", "B008"]

[tool.mypy]
python_version = "3.13"
files = ["src"]
ignore_missing_imports = true
warn_unused_ignores = true
