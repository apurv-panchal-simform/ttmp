[project]
name = "tmp-pipeline"
version = "0.1.0"
description = "TMP extraction, chunking and retrieval pipeline"
authors = [
    { name = "apurvpanchal-simform", email = "apurv.panchal@simformsolutions.com" }
]
requires-python = ">=3.13"
dependencies = [
    "numpy>=2.5.3",
    "opencv-python-headless>=5.0.0.93",
    "pdfplumber>=0.11.10",
    "pillow>=12.3.0",
    "pypdf>=6.19.0",
    "pypdfium2>=5.14.0",
    "pyyaml>=6.0.3",
    "tiktoken>=0.8",
]

[project.optional-dependencies]
azure = ["azure-identity>=1.19"]
postgres = ["psycopg[binary]>=3.2"]
search = []                       # live embeddings and Azure AI Search use only the standard library

[project.scripts]
tmp-pipeline = "tmp_pipeline.run:main"
tmp-pipeline-di = "tmp_pipeline.di.run:main"
tmp-pipeline-gold = "tmp_pipeline.gold.score:main"
tmp-pipeline-facts = "tmp_pipeline.facts.cli:main_facts"
tmp-pipeline-review = "tmp_pipeline.facts.cli:main_review"
tmp-pipeline-db = "tmp_pipeline.db.run:main"
tmp-pipeline-chunks = "tmp_pipeline.chunks.cli:main"
tmp-pipeline-index = "tmp_pipeline.search.run:main"

[build-system]
requires = ["uv_build>=0.10.4,<0.11.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "reportlab>=5.0.1",
    "ruff>=0.9",
    "mypy>=1.14",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "sample: needs tests/data/sample.pdf (fails instead of skipping when TMP_REQUIRE_SAMPLE=1)",
    "live: calls a live Azure service; skipped without credentials",
    "postgres: writes to a PostgreSQL database; skipped without TMP_PG_DSN",
]

[tool.ruff]
line-length = 120
target-version = "py313"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
# style-only rules: long lines and single-letter names are tolerated; the rest stay enforced
ignore = ["E501", "E741", "B905", "SIM102", "SIM110", "B008"]

[tool.mypy]
python_version = "3.13"
files = ["src"]
ignore_missing_imports = true
warn_unused_ignores = true
